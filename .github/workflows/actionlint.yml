name: Actionlint

on:
  push:
    branches: [ master ]
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
  schedule:
    - cron: '25 17 * * 1'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run actionlint
      uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      with:
        # actionlint 1.7.12 predates GitHub's $/ self-repository syntax.
        # Remove this narrow workaround once rhysd/actionlint#711 is released.
        flags: >-
          -ignore
          specifying\x20action\x20"\$/\.github/actions/setup-php-composer"\x20in\x20invalid\x20format\x20because\x20ref\x20is\x20missing
