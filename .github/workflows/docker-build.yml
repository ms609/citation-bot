name: Docker build

on:
  push:
    branches: [ master ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tests/ui/**'
      - 'src/**'
      - '.trivyignore'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tests/ui/**'
      - 'src/**'
      - '.trivyignore'
      - '.github/workflows/docker-build.yml'
  schedule:
    - cron: '40 17 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Harden runner (audit outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node for Apache-backed UI smoke test
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: npm

    - name: Install UI-test dependencies without lifecycle scripts
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Install Chromium
      run: ./node_modules/.bin/playwright install --with-deps chromium

    - name: Build Docker image
      id: build_image
      run: docker build -t citation-bot .

    - name: Validate compose file
      run: docker compose config --quiet

    - name: Start container
      run: docker compose up -d

    - name: Smoke test PHP and Apache
      run: |
        docker compose exec -T php php -r "echo 'PHP OK';"
        docker compose exec -T php php -r '
          foreach (["curl", "mbstring", "xdebug"] as $extension) {
              if (!extension_loaded($extension)) {
                  fwrite(STDERR, $extension . " extension missing\n");
                  exit(1);
              }
              echo $extension . " extension OK\n";
          }
        '
        docker compose exec -T php composer --version
        curl --fail --silent --show-error \
          --retry 10 --retry-connrefused --retry-delay 1 \
          http://localhost:8081/src/ >/dev/null
        echo 'Apache HTTP OK'

    - name: Run read-only Playwright smoke test against Apache
      env:
        UI_BASE_URL: http://localhost:8081/src/
      run: npm run test:ui:external

    - name: Upload Apache UI diagnostics
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: docker-apache-ui-diagnostics
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 7

    - name: Tear down container
      if: always()
      run: docker compose down

    # Scan the image even if later smoke tests fail, but do not scan an
    # image that was never built. Never start expensive scans on cancellation.
    - name: Export Docker image for scanning
      id: export_image
      if: ${{ !cancelled() && steps.build_image.outcome == 'success' }}
      run: docker save citation-bot -o citation-bot.tar

    - name: Run Trivy vulnerability scanner on Docker image
      if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        input: citation-bot.tar
        format: 'sarif'
        output: 'trivy-image-results.sarif'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        exit-code: '1'
        trivyignores: '.trivyignore'

    - name: Upload Trivy image scan results to Security tab
      if: ${{ always() && hashFiles('trivy-image-results.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: 'trivy-image-results.sarif'
        wait-for-processing: false
