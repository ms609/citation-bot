name: Trivy

permissions: {}

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ master ]
  schedule:
    - cron: '55 17 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SARIF_FILE: 'trivy-results.sarif'

jobs:
  build:
    name: Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner on the cloned repository files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,misconfig,secret'
          ignore-unfixed: true
          exit-code: '1'
          format: 'sarif'
          output: ${{ env.SARIF_FILE }}
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Check Trivy scan results existence
        if: ${{ always() }}
        run: |
          if [ ! -f "${{ env.SARIF_FILE }}" ]; then
            echo "Error: ${{ env.SARIF_FILE }} does not exist."
            exit 1
          fi
          ls -lash ${{ env.SARIF_FILE }}

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ always() && hashFiles(env.SARIF_FILE) != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ env.SARIF_FILE }}
          wait-for-processing: false
