name: Trivy

permissions: {}

on:
  pull_request:
  workflow_dispatch:
  push:

env:
  SARIF_FILE: 'trivy-results.sarif'

jobs:
  build:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner on the cloned repository files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,misconfig,secret'
          ignore-unfixed: true
          exit-code: '1'
          format: 'sarif'
          output: ${{ env.SARIF_FILE }}
          severity: 'CRITICAL'
          trivyignores: '.trivyignore'

      - name: Check Trivy scan results existence
        if: ${{ always() }}
        run: |
          if [ ! -f "${{ env.SARIF_FILE }}" ]; then
            echo "Error: ${{ env.SARIF_FILE }} does not exist."
            exit 1
          fi
          ls -lash ${{ env.SARIF_FILE }}

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ always() && hashFiles(env.SARIF_FILE) != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ env.SARIF_FILE }}
          wait-for-processing: false
