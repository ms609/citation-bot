name: Link checker

on:
  schedule:
    - cron: '50 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check links
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: '--no-progress --include-mail "**/*.md" "**/*.html" "catalog-info.yaml" "CITATION.cff" --timeout 60 --host-concurrency 2 --host-request-interval 1s --max-concurrency 16 --verbose'
