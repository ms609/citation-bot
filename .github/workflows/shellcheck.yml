name: Shellcheck

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.sh'
  pull_request:
    branches: [ master ]
    paths:
      - '**/*.sh'
  schedule:
    - cron: '50 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run shellcheck
      run: |
        if ! command -v shellcheck >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
        fi
        shellcheck --version
        find . -type f -name '*.sh' -not -path './vendor/*' -print0 | xargs -0 -r shellcheck
