name: Bot Full Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/codeql-analysis.yml'
      - '.github/workflows/DesignSecurity.yml'
      - '.github/workflows/phan.yml'
      - '.github/workflows/phplint.yml'
      - '.github/workflows/phpstan.yml'
      - '.github/workflows/eslint.yml'
      - '.github/workflows/psalm-security.yml'
      - '.github/workflows/psalm.yml'
      - '.github/workflows/trivy-analysis.yml'
      - '.github/workflows/YamlJson.yml'
      - '.github/workflows/html5check.yml'
      - '.github/workflows/PHPCodeSniffer.yml'
      - '.github/workflows/actionlint.yml'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/labeler.yml'
      - '.github/workflows/link-check.yml'
      - '.github/workflows/config-lint.yml‎'
      - '.github/workflows/cff-validation.yml'
      - '.github/workflows/composer-audit.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/harden-runner-audit.yml'
      - '.github/workflows/openssf-scorecard.yml'
      - '.github/workflows/zizmor.yml'
      - '.github/workflows/codespell.yml'
      - '.github/workflows/browser-ui.yml'
      - '.github/workflows/python-lint.yml'
      - '.gitignore'
      - '.phan'
      - '.phan/config.php'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'eslint.config.mjs'
      - 'LICENSE'
      - 'phpstan.neon'
      - 'progpilot.json'
      - 'progpilot.yml'
      - 'psalm.xml'
      - '.trivyignore'
      - '.phpcs.xml'
      - '.phplint.yml'
      - 'tests/phpunit/README.md'
      - 'AGENTS.md'
      - 'CITATION.cff'
      - '.markdownlint-cli2.yaml'
      - '.github/dependabot.yml'
      - '.github/copilot-instructions.md'
      - '.github/labeler.yml'
      - 'catalog-info.yaml'
      - 'src/assets/results.css'
      - 'src/assets/index.js'
      - 'src/assets/CiteBot.png'
      - 'src/assets/spinner_18_18.gif'
      - '.aider.conf.yml'
      - '.gemini/GEMINI.md'
      - '.hadolint.yaml'
      - '.claude'
      - '.claude/CLAUDE.md'
      - '.cursor'
      - '.cursor/rules'
      - '.cursor/rules/citation-bot.mdc'
      - '.lycheeignore'
      - '.github/workflows/cs1-harness.yml'
      - '.codespellrc'
      - 'ruff.toml'

  schedule:
    - cron: '30 18 * * 1'

permissions:
  contents: read

concurrency:
  # Superseded pull-request commits can be cancelled. Preserve all trusted runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-8-4:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Only one trusted Citoid integration runner may issue requests at a time.
    # PR runners remain fail-closed with no live Citoid lock configuration.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.ref || 'citation-bot-live-citoid' }}
      cancel-in-progress: false

    steps:
    - name: Harden runner (audit outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP and Composer
      uses: $/.github/actions/setup-php-composer
      with:
        php-version: '8.4'
        coverage: pcov
        ini-values: pcov.directory=., opcache.enable=1, opcache.enable_cli=1, opcache.jit_buffer_size=0
        extensions: mbstring, intl, sockets, opcache, openssl, xmlrpc, gettext, curl, iconv, pcre, lzf, zstd, zip, yaml, pcntl, uopz
        cache-key: ${{ runner.os }}-composer-8.4-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-8.4-
          ${{ runner.os }}-composer-

    - name: Verify watchdog, coverage gate and offline flock smoke
      run: python3 -m unittest discover -s .github/scripts -p 'test_ci_*.py'

    - name: Configure Citoid lock for trusted integration tests
      if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      shell: bash
      run: |
        lock_dir="$RUNNER_TEMP/citation-bot-citoid-lock"
        mkdir -p "$lock_dir"
        chmod 700 "$lock_dir"
        umask 077
        namespace_id="$(openssl rand -hex 16)"
        printf 'CBNS1|%s\n' "$namespace_id" > "$lock_dir/rate.namespace"
        chmod 600 "$lock_dir/rate.namespace"
        printf 'CITOID_RATE_LIMIT_DIR=%s\n' "$lock_dir" >> "$GITHUB_ENV"
        printf 'CITOID_RATE_LIMIT_NAMESPACE_ID=%s\n' "$namespace_id" >> "$GITHUB_ENV"

    # Pull-request code must never receive repository secrets.
    - name: Full test with PHP (pull request, no secrets)
      if: ${{ github.event_name == 'pull_request' }}
      run: python3 .github/scripts/ci_test_watchdog.py --idle-seconds 1200 --max-seconds 4800 -- composer run test

    - name: Full test with PHP (trusted events)
      if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      env:
         PHP_ADSABSAPIKEY: ${{ secrets.PHP_ADSABSAPIKEY }}
         PHP_OAUTH_CONSUMER_TOKEN: ${{ secrets.PHP_OAUTH_CONSUMER_TOKEN }}
         PHP_OAUTH_CONSUMER_SECRET: ${{ secrets.PHP_OAUTH_CONSUMER_SECRET }}
         PHP_OAUTH_ACCESS_TOKEN: ${{ secrets.PHP_OAUTH_ACCESS_TOKEN }}
         PHP_OAUTH_ACCESS_SECRET: ${{ secrets.PHP_OAUTH_ACCESS_SECRET }}
         PHP_WP_OAUTH_SECRET: ${{ secrets.PHP_WP_OAUTH_SECRET }}
         PHP_WP_OAUTH_CONSUMER: ${{ secrets.PHP_WP_OAUTH_CONSUMER }}
         PHP_S2APIKEY: ${{ secrets.PHP_S2APIKEY }}
         NLM_APIKEY: ${{ secrets.NLM_APIKEY }}
         NLM_EMAIL: ${{ secrets.NLM_EMAIL }}
      run: python3 .github/scripts/ci_test_watchdog.py --idle-seconds 1200 --max-seconds 4800 -- composer run test

    # Enforce coverage independently of Composer's exit-status propagation.
    # PRs with below-floor coverage must fail, even when unit tests pass.
    - name: Enforce statement coverage floor
      if: ${{ success() }}
      run: php -d memory_limit=1G tests/check_coverage.php coverage.xml

    # Do not print DebugLog.txt: trusted runs may contain API credentials.
    - name: Prepare safe PHP 8.4 test diagnostics
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        python3 .github/scripts/ci_test_report.py --php-version 8.4
        cat test-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload PHP 8.4 test diagnostics
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: php-8.4-test-diagnostics
        path: test-diagnostics/
        if-no-files-found: warn
        retention-days: 7

    - name: Code Coverage
      if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      env:
         CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-8-5:
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: citation-bot-live-citoid
      cancel-in-progress: false

    steps:
    - name: Harden runner (audit outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP and Composer
      uses: $/.github/actions/setup-php-composer
      with:
        php-version: '8.5'
        coverage: pcov
        ini-values: pcov.directory=.
        extensions: mbstring, intl, sockets, opcache, openssl, xmlrpc, gettext, curl, iconv, pcre, lzf, zstd, zip, yaml, pcntl, uopz
        cache-key: ${{ runner.os }}-composer-8.5-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-8.5-

    - name: Configure Citoid lock for scheduled PHP 8.5 integration tests
      shell: bash
      run: |
        lock_dir="$RUNNER_TEMP/citation-bot-citoid-lock"
        mkdir -p "$lock_dir"
        chmod 700 "$lock_dir"
        umask 077
        namespace_id="$(openssl rand -hex 16)"
        printf 'CBNS1|%s\n' "$namespace_id" > "$lock_dir/rate.namespace"
        chmod 600 "$lock_dir/rate.namespace"
        printf 'CITOID_RATE_LIMIT_DIR=%s\n' "$lock_dir" >> "$GITHUB_ENV"
        printf 'CITOID_RATE_LIMIT_NAMESPACE_ID=%s\n' "$namespace_id" >> "$GITHUB_ENV"

    - name: Full test with PHP
      env:
         PHP_ADSABSAPIKEY: ${{ secrets.PHP_ADSABSAPIKEY }}
         PHP_OAUTH_CONSUMER_TOKEN: ${{ secrets.PHP_OAUTH_CONSUMER_TOKEN }}
         PHP_OAUTH_CONSUMER_SECRET: ${{ secrets.PHP_OAUTH_CONSUMER_SECRET }}
         PHP_OAUTH_ACCESS_TOKEN: ${{ secrets.PHP_OAUTH_ACCESS_TOKEN }}
         PHP_OAUTH_ACCESS_SECRET: ${{ secrets.PHP_OAUTH_ACCESS_SECRET }}
         PHP_WP_OAUTH_SECRET: ${{ secrets.PHP_WP_OAUTH_SECRET }}
         PHP_WP_OAUTH_CONSUMER: ${{ secrets.PHP_WP_OAUTH_CONSUMER }}
         PHP_S2APIKEY: ${{ secrets.PHP_S2APIKEY }}
         NLM_APIKEY: ${{ secrets.NLM_APIKEY }}
         NLM_EMAIL: ${{ secrets.NLM_EMAIL }}
      run: python3 .github/scripts/ci_test_watchdog.py --idle-seconds 1200 --max-seconds 4800 -- composer run test

    # Scheduled PHP 8.5 runs must produce diagnostics, too.
    - name: Prepare safe PHP 8.5 test diagnostics
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        python3 .github/scripts/ci_test_report.py --php-version 8.5
        cat test-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload PHP 8.5 test diagnostics
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: php-8.5-test-diagnostics
        path: test-diagnostics/
        if-no-files-found: warn
        retention-days: 7
