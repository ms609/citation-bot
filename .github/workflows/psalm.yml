name: PHP psalm coding

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'psalm.xml'
      - '.github/workflows/psalm.yml'
      - '.github/actions/setup-php-composer/**'
  pull_request:
    branches: [ master ]
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'psalm.xml'
      - '.github/workflows/psalm.yml'
      - '.github/actions/setup-php-composer/**'
  schedule:
    - cron: '15 18 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP and Composer
      uses: $/.github/actions/setup-php-composer
      with:
        php-version: '8.4'
        cache-key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: PHP psalm
      run: composer run psalm
