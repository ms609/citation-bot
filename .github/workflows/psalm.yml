name: PHP psalm coding

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '15 18 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@2.37.2
      with:
        php-version: '8.6'
        coverage: none

    - name: Cache Composer dependencies
      id: composer-cache
      uses: actions/cache@v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    - name: Validate composer.json and composer.lock
      run: composer update --no-install && composer validate

    - name: Install dependencies
      run: composer install -vvv --no-progress

    - name: PHP psalm
      run: composer run psalm
