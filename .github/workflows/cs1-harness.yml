name: CS1 Harness

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/cs1-harness.yml'
      - '.github/actions/setup-php-composer/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/cs1-harness.yml'
      - '.github/actions/setup-php-composer/**'
  schedule:
    - cron: '10 18 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP and Composer
      uses: $/.github/actions/setup-php-composer
      with:
        php-version: '8.4'
        extensions: mbstring, intl, curl, openssl, xml, sockets, pcntl
        cache-key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Run CS1 harness (fast mode)
      run: php tools/cs1_harness.php

    - name: Run CS1 harness (slow mode)
      run: php tools/cs1_harness.php --slow