name: The PHP Security Checker

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '25 18 * * 1'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@2.37.2
      with:
        php-version: '8.6'
        coverage: none

    - name: Validate composer.json and composer.lock
      run: omposer update --no-install && omposer validate

    - name: The PHP Security Checker
      uses: symfonycorp/security-checker-action@v5
