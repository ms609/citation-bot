name: Python lint (Ruff)

on:
  push:
    branches: [ master ]
    paths:
      - '.github/scripts/**/*.py'
      - 'tools/*.py'
      - 'tests/python/**/*.py'
      - 'tools/requirements-spie.txt'
      - '.github/workflows/python-lint.yml'
      - 'ruff.toml'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/scripts/**/*.py'
      - 'tools/*.py'
      - 'tests/python/**/*.py'
      - 'tools/requirements-spie.txt'
      - '.github/workflows/python-lint.yml'
      - 'ruff.toml'
  schedule:
    - cron: '15 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Python
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: '0.16.10'
          src: '.github/scripts'
          args: 'check --output-format=github'

      - name: Lint SPIE maintenance scripts and tests
        run: ruff check --output-format=github tools/build_spie_volume_editors.py tools/lookup_spie_titles.py tools/reconcile_spie_remaining.py tests/python

      # Ruff is installed by the action above; check committed formatting too.
      - name: Check Python formatting
        run: ruff format --check .github/scripts tools/build_spie_volume_editors.py tools/lookup_spie_titles.py tools/reconcile_spie_remaining.py tests/python

      - name: Set up Python for offline tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install offline SPIE dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-spie.txt

      - name: Run offline SPIE regression tests
        run: python -m unittest discover -s tests/python -v
