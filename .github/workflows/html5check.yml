name: HTML5 and CSS Validator

on:
    push:
        branches: [ master ]
        paths:
            - 'src/index.php'
            - 'src/preview.html'
            - 'src/assets/**'
    pull_request:
        branches: [ master ]
        paths:
            - 'src/index.php'
            - 'src/preview.html'
            - 'src/assets/**'
    schedule:
        - cron: '45 17 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Convert index.php to HTML
      uses: jacobtomlinson/gha-find-replace@2ff30f644d2e0078fc028beb9193f5ff0dcad39e # v3
      with:
        find: '<\?php[\s\S]*?\?>'
        replace: ''
        regex: true
        include: 'src/index.php'

    - name: Run validator
      uses: Cyb3r-Jak3/html5validator-action@4ea5e57383ed7e14432ebbaae1b64893b7c5210b # v8.0.0
      with:
        root: src/
        css: true
        log_level: INFO
        extra: --match *.html *.htm *.css index.php
