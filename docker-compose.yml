services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:80" # http://localhost:8081/src/
    volumes:
      - .:/var/www/html
    environment:
      PHP_IDE_CONFIG: "serverName=Docker"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Required for Xdebug to connect back to host (requires Docker 20.10+)
