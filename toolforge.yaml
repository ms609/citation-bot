# Citation Bot scheduled Toolforge jobs
# Load with:
# toolforge jobs load toolforge.yaml
# Kill all cron jobs:
# toolforge jobs flush 
# List all cron jobs:
# toolforge jobs list
# Remember simply doing "git pull" and updating this file does not update cron

- name: update-statistics
  image: php8.4
  command: php /data/project/citations/git_repo/src/update_statistics.php
  schedule: "5 0 * * *"
  retry: 0

- name: session-cleanup
  image: bookworm
  command: bash -c "find ~/sessions/ -type f -name 'sess_*' \( -size -109c -amin +60 -o -atime +7 \) -delete"
  schedule: "0 */8 * * *"

- name: refresh-retraction-watch
  image: php8.4
  command: php /data/project/citations/git_repo/tools/update_retraction_watch.php
  schedule: "17 6 * * *"
  mount: all
  timeout: 300
  retry: 1
  emails: onfailure
